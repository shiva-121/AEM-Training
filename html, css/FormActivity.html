<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Form</title>
</head>
<body>
<h1>All form control demo</h1>
<form>
<table border=1>
	<tr>
		<td>First Name:</td>
		<td><input type=text name=fname required></td>
	</tr>
	<tr>
		<td>Last Name:</td>
		<td><input type=text name=lname required></td>
	</tr>
	<tr>
		<td>Address:</td>
		<td><textarea cols="40" rows="5" name=address required></textarea></td>
	</tr>
	<tr>
		<td>Maritial Status:</td>
		<td>
		<input type=radio name=mstatus id=married required>
		<label for=married>Married</label>
		<input type=radio name=mstatus id=single required>
		<label for=single>Single</label>
		</td>
	</tr>
	<tr>
		<td>Skill:</td>
		<td>
			<input type=checkbox name=skill id=singing>
			<label for=singing>Singing</label>
			<input type=checkbox name=skill id=dancing>
			<label for=dancing>Dancing</label>
			<input type=checkbox name=skill id=drawing>
			<label for=drawing>Drawing</label>
		</td>
	</tr>
	<tr>
		<td>Profession:</td>
		<td>
			<select name=profession required>
			<option value="" selected>--Select</option>
			<option value=privateJob>Private Job</option>
			<option value=governmentJob>Government Job</option>
			</select>
		</td>
	</tr>
	<tr>
		<td>Hidden:</td>
		<td><input type=hidden></td>
	</tr>
	<tr>
		<td>Upload your photo:</td>
		<td><input type=file></td>
	</tr>
	<tr>
		<td><input type=submit value=Submit></td>
		<td><input type=reset></td>
	</tr>
</table>
</form>
</body>
</html>
