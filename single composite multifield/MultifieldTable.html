<h2>Composite Multified Values in Table</h2>

<sly data-sly-use.objName="com.adobe.ase.aem.training.core.models.ComponentInterfaceName">

<table border="1">
    <thead>
        <tr>
            <th>Field - 1</th>
            <th>Field - 2</th>
            <th>Field - 3</th>
        </tr>
    </thead>
    <tbody data-sly-list.item="${objName.Composite-Multifield-Field-Name}">
        <tr>
            <td>${item.name}</td>
            <td>${item.location}</td>
            <td>${item.type}</td>
        </tr>
    </tbody>
</table>
